[project]
name = "headwater"
version = "0.4.1"
description = "A Python library for life cycle assessment (LCA)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Leonardo Natale" }]
keywords = [
    "life cycle assessment",
    "lca",
    "carbon footprint",
    "ecoinvent",
    "environmental footprint",
    "sustainability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.13"
# Lower bounds are the oldest versions the tests pass with on Python 3.13 (the `lowest` CI job).
dependencies = [
    "numpy>=2.1",
    "scipy>=1.17",
    "pydantic>=2.8",
    "pyyaml>=6.0.2",
    "duckdb>=1.5.6",
    "pyarrow>=26.0.0",
    "lxml>=6.1.3",
    "typer>=0.27.2",
    "openpyxl>=3.1.5",
    "fsspec[http]>=2026.9.0",
]

[project.urls]
Repository = "https://github.com/LeonardoNatale/headwater"
Documentation = "https://github.com/LeonardoNatale/headwater/tree/main/docs"
Issues = "https://github.com/LeonardoNatale/headwater/issues"

[project.scripts]
headwater = "headwater.cli:main"

[project.optional-dependencies]
gcs = [
    "gcsfs>=2026.10.1",
]
s3 = [
    "s3fs>=2026.9.0",
]
pandas = [
    "pandas>=2.2.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "jsonschema>=4.26",
    "pandas>=2.2",
    "pandas-stubs",
    "pre-commit>=4.7.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright[nodejs]",
    "pytest",
    "ruff",
    "scipy-stubs",
    "types-lxml>=2026.2.16",
    "types-openpyxl>=3.1.5.20260827",
]
# Run the teaching notebooks in notebooks/. pandas is only there to show tables.
notebooks = [
    "ipykernel",
    "nbmake",
    "pandas",
]
# Brightway, for notebooks 05 and 06 only, at the versions of bench/README.md. peewee is pinned
# because bw2data 4.5.4 does not limit it, and the newest peewee breaks its import.
brightway = [
    "bw2data==4.5.4",
    "bw2calc==2.3",
    "bw2io==0.9.14",
    "peewee==3.19.0",
]

[tool.ruff]
line-length = 100
# bench/ holds research scripts kept as they were run, not library code.
extend-exclude = ["bench"]

[tool.ruff.format]
# The Python blocks in docs/ are illustrative, not code to format.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files in different folders may share a name (tests/calc/test_x.py, tests/model/test_x.py).
addopts = ["--import-mode=importlib"]
# A UserWarning raised in headwater's own code, or by a library it calls, fails the test.
filterwarnings = ["error::UserWarning:headwater"]

# The layers of the package, checked by `uv run lint-imports` (AGENTS.md rules 8 and 13).
# Imports under `if TYPE_CHECKING:` count too.
[tool.importlinter]
root_package = "headwater"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "calc/ imports no part of headwater but model, and no I/O library"
type = "forbidden"
source_modules = ["headwater.calc"]
forbidden_modules = [
    "headwater._lazy",
    "headwater.cli",
    "headwater.diff",
    "headwater.io",
    "headwater.link",
    "headwater.query",
    "headwater.release",
    "headwater.study",
    "headwater.upgrade",
    "csv",
    "duckdb",
    "fsspec",
    "gcsfs",
    "http",
    "io",
    "json",
    "lxml",
    "openpyxl",
    "os",
    "pandas",
    "pathlib",
    "pickle",
    "pyarrow",
    "s3fs",
    "shutil",
    "socket",
    "sqlite3",
    "subprocess",
    "tempfile",
    "typer",
    "urllib",
    "yaml",
]
broken_contract_guidance = "calc/ takes arrays and returns arrays (AGENTS.md rule 8). Read files, cache and print in the layer that calls it, query/ or cli/, and pass calc/ the arrays."

[[tool.importlinter.contracts]]
name = "calc/ imports no third-party library but numpy and scipy"
type = "forbidden"
source_modules = ["headwater.calc"]
# Every dependency of pyproject.toml but numpy and scipy (tests/test_layers.py). pydantic reaches
# calc/ through headwater.model, so only a direct import is refused.
forbidden_modules = ["pydantic"]
allow_indirect_imports = true
broken_contract_guidance = "calc/ imports only headwater.model, numpy, scipy and the standard library (AGENTS.md rule 13)."

[[tool.importlinter.contracts]]
name = "model/ imports no other part of headwater"
type = "forbidden"
source_modules = ["headwater.model"]
forbidden_modules = [
    "headwater._lazy",
    "headwater.calc",
    "headwater.cli",
    "headwater.diff",
    "headwater.io",
    "headwater.link",
    "headwater.query",
    "headwater.release",
    "headwater.study",
    "headwater.upgrade",
]
broken_contract_guidance = "model/ holds the records every other part uses, so it imports none of them (AGENTS.md rule 13)."

[[tool.importlinter.contracts]]
name = "Nothing imports cli/"
type = "protected"
protected_modules = ["headwater.cli"]
allowed_importers = []
as_packages = true
broken_contract_guidance = "cli/ is the top layer, a thin layer over the Python API (AGENTS.md rule 13). Move what the other module needs out of cli/, into the package that owns it."
